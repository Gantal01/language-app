services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: languageapp
      POSTGRES_USER: languageapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U languageapp -d languageapp"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
